name: PR Size Check
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const files = pr.changed_files;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const total = additions + deletions;

            if (files > 30 || total > 800) {
              core.warning(
                `Large PR detected: ${files} files changed, +${additions}/-${deletions} lines. ` +
                `Consider splitting into smaller PRs for easier review.`
              );
            }

            core.summary
              .addHeading('PR Size')
              .addTable([
                [{data: 'Files', header: true}, {data: 'Additions', header: true}, {data: 'Deletions', header: true}],
                [String(files), String(additions), String(deletions)]
              ])
              .write();
